<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./src/style.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=delete" />
  <title>laboration1</title>
</head>

<body>
  <main>
    <header>
      <h1>Laboration 1</h1>
      <p>Programmering i TypeScript</p>
    </header>
    <section>
      <h2>Visa och lägga till kurser</h2>
      <div class="courses">
        <div class="add-course">
          <h3>Lägg till ny kurs</h3>
          <p>Fyll i fälten för att lägga till nya kurser i listan</p>
          <form id="form">
            <div class="inputs">
              <label for="cCode">Kurskod:</label>
              <input type="text" name="courseCode" id="cCode">
            </div>
            <div class="inputs">
              <label for="cName">Kursnamn:</label>
              <input type="text" name="courseName" id="cName">
            </div>
            <div class="inputs">
              <label for="cProg">Progression:</label>
              <select name="courseProgression" id="cProg">
                <option value="A">A</option>
                <option value="B">B</option>
                <option value="C">C</option>
              </select>
            </div>
            <div class="inputs">
              <label for="cSyllabus">Syllabus (URL)</label>
              <input type="text" name="courseSyllabus" id="cSyllabus">
            </div>
            <div class="error"></div>
            <button id="submit-btn" class="buttonstyle" type="submit">Lägg till kurs</button>
          </form>
        </div>
        <div id="courses">
          <h3>Tillagda kurser:</h3>
          <div id="course-list"></div>
        </div>

      </div>
    </section>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
